version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fed-educ-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: business_record_db
    ports:
      - "5432:5432" # Exposes PostgreSQL on host port 543
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  backend:
    build: ./src_api
    container_name: business-record-app-src_api
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DEBUG=${DEBUG}
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health/'); sys.exit(0) if r.getcode()==200 else sys.exit(1)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    ports:
      - "8000:8000" # Exposes backend on host port 8000 (rootless compatible)
    restart: unless-stopped
    

  frontend:
    build: ./inventory-frontend
    container_name: business-record-app-frontend
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000
    networks:
      - app-network
    restart: unless-stopped
    ports:
      - "8080:80" # Exposes frontend on host port 8080 (rootless compatible)

  # Optional: If you want a dedicated Nginx reverse proxy at the root
  # If using the frontend's internal nginx, you can skip this service
  # and map port 80 directly to the frontend service in 'ports' below.

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: