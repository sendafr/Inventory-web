
services:
  db:
    image: postgres:15-alpine
    container_name: business-record-app-db
    environment:
      POSTGRES_DB: ${DB_NAME:-authentic_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sendi@0#*pU7!127}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-authentic_db}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app_network

  api:
    build:
      context: ./src_api
      dockerfile: Dockerfile
    container_name: business-record-app-src_api
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 300 inventory_api.wsgi:application"
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key}
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,api"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-authentic_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-sendi@0#*pU7!127}
      DB_HOST: db  # ✅ Matches the service name in docker-compose
      DB_PORT: ${DB_PORT:-5432}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://inventory_frontend}
    volumes:
      - ./src_api:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app_network
    restart: unless-stopped

  inventory_frontend:
    build:
      context: ./inventory-frontend
      dockerfile: Dockerfile
    container_name: business-record-app-inventory-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "8080:8080"
    depends_on:
      - api
    volumes:
      - ./inventory-frontend:/app
      - /app/node_modules
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  app_network:
    driver: bridge
