services:
  - type: web
    name: business-record-app-backend
    env: docker
    root: src_api
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,business-record-app-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://business-record-app-frontend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: business-record-app-db
          property: connectionString

  - type: web
    name: business-record-app-frontend
    env: docker
    root: inventory-frontend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        value: "https://business-record-app-backend.onrender.com"

databases:
  - name: business-record-app-db
    type: postgresql
    plan: starter
    databaseName: business_record_db
    region: oregon
