server {
    # Listen on the port provided by Render ($PORT) or default to 80 for local testing
    # Listen on port 80 inside the container (host maps 8080 -> 80)
    listen 80;
    server_name localhost;

    # Serve static files (Vite build output)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Backend
    # We use an environment variable for the backend URL
    location /api/ {
        # Render will inject this variable. If not set, Docker start script will
        # replace an empty value with the Docker backend fallback.
        proxy_pass __VITE_API_URL__;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle WebSocket if needed (optional)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}